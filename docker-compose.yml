services:
  frontend:
    build: ./frontend
    container_name: surat_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: surat_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/vendor
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: app
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      # URL backend yang bisa diakses dari dalam Docker network
      # Dipakai oleh ONLYOFFICE untuk fetch file DOCX
      # APP_URL: http://backend:8000
      # ONLYOFFICE_DOCUMENT_BASE_URL: "http://backend:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: surat_postgres
    restart: always
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: surat_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres

  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./docs:/docs

  # ─── ONLYOFFICE Document Server ───────────────────────────────────────────
  # Rendering DOCX pixel-perfect (header, footer, margin, table, font).
  # Menggantikan docx-preview / mammoth untuk preview surat di mou2.tsx.
  # JWT_ENABLED=false untuk development — aktifkan di production.
  # Akses dari browser: http://localhost:8082
  # Akses dari Docker network: http://onlyoffice


volumes:
  postgres_data: